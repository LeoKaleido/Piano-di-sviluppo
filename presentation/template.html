<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Il piano operativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #0B1118; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0; }
  .slide { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; visibility: hidden; opacity: 0; transition: opacity 0.25s ease; }
  .slide.active { visibility: visible; opacity: 1; }
  .slide aside { display: none; }
  #bar { position: fixed; left: 0; bottom: 0; height: 4px; background: #F08A5D; width: 0; transition: width 0.25s ease; z-index: 5; }
  #counter { position: fixed; right: 16px; bottom: 12px; font: 500 14px 'DM Sans', Arial, sans-serif; color: #AEB7C0; opacity: 0; transition: opacity 0.3s; z-index: 5; }
  body.hint #counter { opacity: 0.8; }
  #notes { position: fixed; left: 0; right: 0; bottom: 0; max-height: 40%; overflow: auto; padding: 20px 32px 28px; background: rgba(11, 17, 24, 0.94); color: #F7F5F0; font: 400 22px/1.45 'DM Sans', Arial, sans-serif; display: none; z-index: 6; }
  body.notes #notes { display: block; }
  #help { position: fixed; left: 16px; bottom: 12px; font: 500 14px 'DM Sans', Arial, sans-serif; color: #AEB7C0; opacity: 0; transition: opacity 0.3s; z-index: 5; }
  body.hint #help { opacity: 0.8; }
  body.notes #help, body.notes #counter { bottom: calc(40% + 12px); }
  @media print {
    html, body { overflow: visible; height: auto; background: #fff; }
    #stage { position: static; transform: none !important; width: auto; height: auto; }
    .slide { position: relative; visibility: visible; opacity: 1; page-break-after: always; }
    #bar, #counter, #notes, #help { display: none !important; }
    @page { size: 1920px 1080px; margin: 0; }
  }
</style>
</head>
<body>
<div id="stage">
{{SLIDES}}
</div>
<div id="bar"></div>
<div id="help">Frecce o spazio: avanti e indietro. F: schermo intero. N: note. Home e Fine.</div>
<div id="counter"></div>
<div id="notes"></div>
<script>
(function () {
  var stage = document.getElementById('stage');
  var slides = Array.prototype.slice.call(stage.querySelectorAll('.slide'));
  var bar = document.getElementById('bar');
  var counter = document.getElementById('counter');
  var notes = document.getElementById('notes');
  var current = 0;
  var hintTimer = null;

  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    var x = -960 * s, y = -540 * s;
    stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
  }

  function hint() {
    document.body.classList.add('hint');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function () { document.body.classList.remove('hint'); }, 2200);
  }

  function show(n, quiet) {
    current = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach(function (el, i) { el.classList.toggle('active', i === current); });
    bar.style.width = ((current + 1) / slides.length * 100) + '%';
    counter.textContent = (current + 1) + ' / ' + slides.length;
    var aside = slides[current].querySelector('aside');
    notes.textContent = aside ? aside.textContent.trim() : '';
    try { history.replaceState(null, '', '#' + (current + 1)); } catch (e) {}
    if (!quiet) hint();
  }

  function next() { show(current + 1); }
  function prev() { show(current - 1); }

  function fullscreen() {
    if (!document.fullscreenElement) {
      if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    } else if (document.exitFullscreen) {
      document.exitFullscreen();
    }
  }

  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || k === ' ' || k === 'Enter') { e.preventDefault(); next(); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || k === 'Backspace') { e.preventDefault(); prev(); }
    else if (k === 'Home') { e.preventDefault(); show(0); }
    else if (k === 'End') { e.preventDefault(); show(slides.length - 1); }
    else if (k === 'f' || k === 'F') { fullscreen(); }
    else if (k === 'n' || k === 'N') { document.body.classList.toggle('notes'); }
  });

  document.addEventListener('click', function (e) {
    if (e.clientX < window.innerWidth * 0.25) prev(); else next();
  });

  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', function () {
    var n = parseInt(location.hash.replace('#', ''), 10);
    if (!isNaN(n)) show(n - 1, true);
  });

  fit();
  var start = parseInt(location.hash.replace('#', ''), 10);
  show(isNaN(start) ? 0 : start - 1, true);
  hint();
})();
</script>
</body>
</html>
